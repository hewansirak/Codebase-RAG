[project]
name = "codebase-rag"
version = "0.1.0"
description = "Chat with any GitHub repository: hybrid BM25 + vector retrieval, reranking and line-level citations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hewan Sirak" }]
dependencies = [
  "numpy>=1.26",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "plotly>=5.20",
  "streamlit>=1.40",
]

[project.optional-dependencies]
ml = ["sentence-transformers>=3.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
codebase-rag = "codebase_rag.cli:main"

[tool.setuptools.packages.find]
include = ["codebase_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", ".venv"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
